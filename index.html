<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000">
<title>Image Feed</title>
<link rel="preconnect" href="https://usa.msfcfinance.in" crossorigin>
<link rel="dns-prefetch" href="//usa.msfcfinance.in">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}
body{font-family:Arial,sans-serif}
#feed{width:100%;height:100dvh;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch}
.item{position:relative;width:100%;height:100dvh;min-height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;background:#000}
.item a{display:block;width:100%;height:100%;touch-action:manipulation}
.item img{display:block;width:100%;height:100%;object-fit:cover;user-select:none;-webkit-user-drag:none}
</style>
</head>
<body>
<main id="feed"></main>

<script>
const DATA={"images": ["https://instantchatroom.org/new%20done/Screenshot_2026-08-24-17-27-29-90_a23b203fd3aafc6dcb84e438dda678b6.jpg", "https://instantchatroom.org/new%20done/Screenshot_2026-08-24-17-25-04-34_a23b203fd3aafc6dcb84e438dda678b6.jpg", "https://instantchatroom.org/new%20done/Screenshot_2026-08-24-17-24-50-30_a23b203fd3aafc6dcb84e438dda678b6.jpg", "https://instantchatroom.org/new%20done/Screenshot_2026-08-24-17-24-34-29_a23b203fd3aafc6dcb84e438dda678b6.jpg", "https://instantchatroom.org/new%20done/Screenshot_2026-08-24-17-20-21-29_a23b203fd3aafc6dcb84e438dda678b6.jpg", "https://instantchatroom.org/new%20done/IMG_2725.PNG", "https://instantchatroom.org/new%20done/IMG_2724.PNG", "https://instantchatroom.org/new%20done/IMG_2723.PNG", "https://instantchatroom.org/new%20done/IMG_2722.PNG", "https://instantchatroom.org/new%20done/IMG_2721.PNG", "https://instantchatroom.org/new%20done/IMG_2720.PNG", "https://instantchatroom.org/new%20done/IMG_2719.PNG", "https://instantchatroom.org/new%20done/IMG_2718.PNG", "https://instantchatroom.org/new%20done/IMG_2716.PNG", "https://instantchatroom.org/new%20done/IMG_20260824_172321.jpg"], "articles": ["https://usa.msfcfinance.in/study-in-usa-universities-2026-cost-loans-visa-salary-and-best-universities-for-international-students-%f0%9f%87%ba%f0%9f%87%b8/", "https://usa.msfcfinance.in/study-in-uk-universities-2026-tuition-fees-mba-cost-scholarships-student-visa-bank-balance-and-graduate-salary-roi/", "https://usa.msfcfinance.in/study-in-new-zealand-2026-2027-university-fees-student-visa-education-loans-ielts-score-salary-pr-complete-tier-1-guide/", "https://usa.msfcfinance.in/study-in-australia-2026-complete-guide-for-international-students-universities-fees-visa-loans-pr-high-salary-careers/"]};
const HISTORY_KEY="image_feed_used_pairs_v3";
const RETURN_KEY="image_feed_return_v3";
const SESSION_FIRST_KEY="image_feed_first_v3";

function loadHistory(){
  try{return JSON.parse(localStorage.getItem(HISTORY_KEY)||"[]")}
  catch(e){return[]}
}
function saveHistory(a){localStorage.setItem(HISTORY_KEY,JSON.stringify(a))}
function shuffle(a){
  a=[...a];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  return a;
}

/* 15 images x 4 articles = 60 unique pairs. */
let used=loadHistory();

function nextPair(){
  let available=[];
  for(const image of DATA.images){
    for(const article of DATA.articles){
      const key=image+"|||"+article;
      if(!used.includes(key)) available.push({image,article,key});
    }
  }
  if(!available.length){
    used=[];
    for(const image of DATA.images)
      for(const article of DATA.articles)
        available.push({image,article,key:image+"|||"+article});
  }
  const p=shuffle(available)[0];
  used.push(p.key);
  saveHistory(used);
  return p;
}

let redirectTimer=null;
let navigating=false;
let currentArticle=null;

function beginTimer(article){
  currentArticle=article;
  navigating=false;
  clearTimeout(redirectTimer);
  redirectTimer=setTimeout(()=>go(article),15000);
}

function go(article){
  if(!article || navigating)return;
  navigating=true;
  clearTimeout(redirectTimer);
  sessionStorage.setItem(RETURN_KEY,"1");
  // Direct same-tab navigation: no artificial delay.
  window.location.assign(article);
}

function makeItem(pair){
  const section=document.createElement("section");
  section.className="item";
  section.dataset.article=pair.article;

  const a=document.createElement("a");
  a.href=pair.article;
  a.target="_self";
  a.rel="noopener";

  const img=document.createElement("img");
  img.src=pair.image;
  img.alt="";
  img.loading="eager";
  img.decoding="async";
  img.draggable=false;

  const activate=(e)=>{
    e.preventDefault();
    e.stopPropagation();
    go(pair.article);
  };
  a.addEventListener("pointerup",activate,{passive:false});
  a.addEventListener("click",activate,{passive:false});

  a.appendChild(img);
  section.appendChild(a);
  feed.appendChild(section);
  observer.observe(section);
}

const feed=document.getElementById("feed");

const observer=new IntersectionObserver(entries=>{
  for(const entry of entries){
    if(entry.isIntersecting && entry.intersectionRatio>=0.75){
      const article=entry.target.dataset.article;
      beginTimer(article);
    }
  }
},{threshold:[0.75]});

/* Initial feed. Every screen gets its own never-before-used pair. */
for(let i=0;i<5;i++){
  const p=nextPair();
  makeItem(p);
}

/* Keep several screens ready. */
function addMore(){
  for(let i=0;i<3;i++) makeItem(nextPair());
}
feed.addEventListener("scroll",()=>{
  if(feed.scrollTop+feed.clientHeight>=feed.scrollHeight-feed.clientHeight*2) addMore();
},{passive:true});

/*
  Critical return behavior:
  The article is opened in the same tab. When Back returns to this page,
  browser page restoration is ignored: the feed is cleared and rebuilt with
  fresh unused pairs. Therefore the old image/article pair cannot reappear.
*/
window.addEventListener("pageshow",()=>{
  if(sessionStorage.getItem(RETURN_KEY)!=="1") return;
  sessionStorage.removeItem(RETURN_KEY);

  requestAnimationFrame(()=>{
    clearTimeout(redirectTimer);
    navigating=false;
    used=loadHistory();

    feed.innerHTML="";
    for(let i=0;i<5;i++) makeItem(nextPair());

    feed.scrollTop=0;
    const first=feed.querySelector(".item");
    if(first) beginTimer(first.dataset.article);
  });
});

/* Preconnect/prefetch all four article destinations. */
for(const url of DATA.articles){
  const l=document.createElement("link");
  l.rel="prefetch";
  l.href=url;
  document.head.appendChild(l);
}
</script>
</body>
</html>
