<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reel</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#000;overscroll-behavior-y:none}
  #reel{
    height:100dvh;
    overflow-y:scroll;
    scroll-snap-type:y mandatory;
    scroll-behavior:smooth;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  @media (prefers-reduced-motion:reduce){
    #reel{scroll-behavior:auto}
  }

  /* scroll cue — first slide only, disappears for good after first scroll */
  #cue{
    position:fixed;left:0;right:0;bottom:0;
    z-index:5;
    height:220px;
    display:flex;align-items:flex-end;justify-content:center;
    padding-bottom:calc(90px + env(safe-area-inset-bottom));
    background:linear-gradient(to top,rgba(0,0,0,.55),rgba(0,0,0,0));
    pointer-events:none;
    transition:opacity .45s ease;
  }
  #cue.gone{opacity:0}
  #cue span{
    display:block;width:26px;height:26px;
    border-right:2.5px solid #fff;
    border-bottom:2.5px solid #fff;
    transform:rotate(45deg);
    border-radius:2px;
    filter:drop-shadow(0 2px 6px rgba(0,0,0,.6));
    animation:bob 1.5s ease-in-out infinite;
  }
  @keyframes bob{
    0%,100%{transform:rotate(45deg) translate(0,0);opacity:.55}
    50%    {transform:rotate(45deg) translate(6px,6px);opacity:1}
  }
  @media (prefers-reduced-motion:reduce){
    #cue span{animation:none;opacity:.85}
  }
  #reel::-webkit-scrollbar{display:none}
  .slide{
    height:100dvh;
    scroll-snap-align:start;
    scroll-snap-stop:always;
  }
  .slide img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    border:0;
  }
</style>
</head>
<body>
<main id="reel"></main>
<div id="cue"><span></span></div>
<script>
/* ---- only edit this list ---- */
const SLIDES = [
  "https://pub-5f52dd93f3804fbcb113f853eb38a385.r2.dev/new%20done/IMG_2721.PNG",
  "https://pub-5f52dd93f3804fbcb113f853eb38a385.r2.dev/new%20done/IMG_2720.PNG",
  "https://pub-5f52dd93f3804fbcb113f853eb38a385.r2.dev/new%20done/IMG_2719.PNG",
  "https://pub-5f52dd93f3804fbcb113f853eb38a385.r2.dev/new%20done/IMG_2718.PNG",
  "https://pub-5f52dd93f3804fbcb113f853eb38a385.r2.dev/new%20done/IMG_2716.PNG"
];
const AHEAD = 2;
/* ----------------------------- */

const reel = document.getElementById('reel'), imgs = [];

SLIDES.forEach((src,i)=>{
  const s = document.createElement('section');
  s.className = 'slide';
  const img = document.createElement('img');
  img.alt = ''; img.decoding = 'async';
  if(i < 2){ img.src = src; img.fetchPriority = i ? 'auto' : 'high'; }
  else { img.dataset.src = src; img.loading = 'lazy'; }
  s.appendChild(img); reel.appendChild(s); imgs.push(img);
});

const load = i => { const m = imgs[i]; if(m && m.dataset.src){ m.src = m.dataset.src; delete m.dataset.src; } };

const io = new IntersectionObserver(es => es.forEach(e => {
  if(e.isIntersecting){
    const i = [...reel.children].indexOf(e.target);
    for(let n = 1; n <= AHEAD; n++) load(i + n);
  }
}), {root: reel, threshold: .5});
[...reel.children].forEach(s => io.observe(s));

// hide the scroll cue the moment they move
const cue = document.getElementById('cue');
let nudging = false, userTook = false;

function hideCue(){
  if(!cue.isConnected) return;
  cue.classList.add('gone');
  setTimeout(() => cue.remove(), 500);
}

reel.addEventListener('scroll', () => {
  if(nudging) return;                 // ignore our own animation
  if(reel.scrollTop > 20) hideCue();
}, {passive:true});

// user takes over -> cancel the nudge immediately
['touchstart','wheel','keydown','pointerdown'].forEach(ev =>
  window.addEventListener(ev, () => {
    userTook = true;
    if(nudging){ nudging = false; reel.style.scrollSnapType = 'y mandatory'; }
  }, {passive:true, once:false})
);

/* auto-nudge: peek at image 2, then settle back on image 1 */
const wait = ms => new Promise(r => setTimeout(r, ms));

async function nudge(){
  if(userTook || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  nudging = true;
  reel.style.scrollSnapType = 'none';           // snap off, or it fights us

  reel.scrollTo({top: window.innerHeight * 0.5, behavior: 'smooth'});
  await wait(700);
  if(!nudging) return;                          // user interrupted

  await wait(600);                              // hold the peek
  if(!nudging) return;

  reel.scrollTo({top: 0, behavior: 'smooth'});
  await wait(700);

  nudging = false;
  reel.style.scrollSnapType = 'y mandatory';    // snap back on
}

// run once image 1 is actually on screen
if(imgs[0].complete) setTimeout(nudge, 500);
else imgs[0].addEventListener('load', () => setTimeout(nudge, 500), {once:true});
</script>
</body>
</html>
