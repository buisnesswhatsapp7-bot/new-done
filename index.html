<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reel</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#000;overscroll-behavior-y:none}

  #reel{
    height:100dvh;
    overflow-y:scroll;
    scroll-snap-type:y mandatory;
    scroll-behavior:smooth;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    will-change:scroll-position;
    transform:translateZ(0);
  }
  #reel::-webkit-scrollbar{display:none}

  .slide{
    height:100dvh;
    scroll-snap-align:start;
    scroll-snap-stop:always;
    contain:layout paint;
    transform:translateZ(0);
    backface-visibility:hidden;
  }
  .slide img{
    width:100%;height:100%;
    object-fit:cover;
    display:block;border:0;
    transform:translateZ(0);
    backface-visibility:hidden;
    opacity:0;
    transition:opacity .3s ease-out;
  }
  .slide img.in{opacity:1}

  @media (prefers-reduced-motion:reduce){
    #reel{scroll-behavior:auto}
    .slide img{transition:none;opacity:1}
  }

  #cue{
    position:fixed;left:0;right:0;bottom:0;
    z-index:5;height:220px;
    display:flex;align-items:flex-end;justify-content:center;
    padding-bottom:calc(90px + env(safe-area-inset-bottom));
    background:linear-gradient(to top,rgba(0,0,0,.55),rgba(0,0,0,0));
    pointer-events:none;
    transition:opacity .45s ease;
    will-change:opacity;
  }
  #cue.gone{opacity:0}
  #cue span{
    display:block;width:26px;height:26px;
    border-right:2.5px solid #fff;
    border-bottom:2.5px solid #fff;
    transform:rotate(45deg);border-radius:2px;
    filter:drop-shadow(0 2px 6px rgba(0,0,0,.6));
    animation:bob 1.8s cubic-bezier(.45,0,.25,1) infinite;
    will-change:transform,opacity;
  }
  @keyframes bob{
    0%,100%{transform:rotate(45deg) translate(0,0);opacity:.5}
    50%    {transform:rotate(45deg) translate(6px,6px);opacity:1}
  }
  @media (prefers-reduced-motion:reduce){#cue span{animation:none;opacity:.85}}
</style>
</head>
<body>
<main id="reel"></main>
<div id="cue"><span></span></div>
<script>
/* ============ EDIT THIS BLOCK ONLY ============ */

// Full pool. Add as many as you like — the more you add,
// the more new images a returning visitor sees.
const POOL = [
  "https://pub-5f52dd93f3804fbcb113f853eb38a385.r2.dev/new%20done/IMG_2721.PNG",
  "https://pub-5f52dd93f3804fbcb113f853eb38a385.r2.dev/new%20done/IMG_2720.PNG",
  "https://pub-5f52dd93f3804fbcb113f853eb38a385.r2.dev/new%20done/IMG_2719.PNG",
  "https://pub-5f52dd93f3804fbcb113f853eb38a385.r2.dev/new%20done/IMG_2718.PNG",
  "https://pub-5f52dd93f3804fbcb113f853eb38a385.r2.dev/new%20done/IMG_2716.PNG"
,
  "https://pub-5f52dd93f3804fbcb113f853eb38a385.r2.dev/new%20done/IMG_2722.PNG",
  "https://pub-5f52dd93f3804fbcb113f853eb38a385.r2.dev/new%20done/IMG_2725.PNG",
  "https://pub-5f52dd93f3804fbcb113f853eb38a385.r2.dev/new%20done/IMG_2723.PNG",
  "https://pub-5f52dd93f3804fbcb113f853eb38a385.r2.dev/new%20done/IMG_2724.PNG"
];

const PER_VISIT = 3;                      // how many images to show per visit
const AHEAD     = 3;                      // slides preloaded + decoded ahead
const MEMORY_MS = 10 * 60 * 1000;         // how long "already seen" is remembered (10 min)

const DEST      = "https://msfcfinance.in/2025/09/12/best-credit-cards-in-the-uk-2025-cashback-0-deals-travel-cards-you-should-know-about/";
const AUTO_MS   = 8000;                   // auto-redirect delay
const START_ON  = "load";                 // "load" or "scroll"

/* ============================================== */

const reel = document.getElementById('reel');
let imgs = [], io = null, anim = null;
let nudging = false, userTook = false, sent = false, autoTimer = null;

/* ---- remembers which images this visitor already saw ---- */
let memSeen = {t:0, list:[]};
function seenGet(){
  let rec = memSeen;
  try { rec = JSON.parse(localStorage.getItem('rseen') || 'null') || memSeen; } catch(e){}
  // expired -> forget everything, visitor starts fresh
  if(!rec.t || Date.now() - rec.t > MEMORY_MS) return [];
  return rec.list || [];
}
function seenSet(list){
  // timestamp refreshes on every visit, so an active session keeps skipping
  const rec = {t: Date.now(), list: list};
  memSeen = rec;
  try { localStorage.setItem('rseen', JSON.stringify(rec)); } catch(e){}
}

/* Pick only images this visitor has NOT seen before.
   When the pool runs out, a fresh cycle starts automatically. */
function nextSet(){
  const n = Math.min(PER_VISIT, POOL.length);
  const seen = seenGet();
  const unseen = POOL.filter(u => !seen.includes(u));

  let out = unseen.slice(0, n);

  if(out.length < n){
    // everything has been seen -> begin a new cycle
    const rest = POOL.filter(u => !out.includes(u));
    out = out.concat(rest.slice(0, n - out.length));
    seenSet(out);
  } else {
    seenSet(seen.concat(out));
  }
  return out;
}

/* ---- image loading: decode before paint, so no swipe stutter ---- */
function load(i){
  const img = imgs[i];
  if(!img || !img.dataset.src) return;
  const src = img.dataset.src;
  delete img.dataset.src;
  const pre = new Image();
  pre.decoding = 'async';
  if(i === 0) pre.fetchPriority = 'high';
  pre.src = src;
  const show = () => { img.src = src; requestAnimationFrame(() => img.classList.add('in')); };
  const fail = () => { const s = img.parentElement; if(s) s.style.display = 'none'; };  // bad link -> skip slide
  pre.onerror = fail;
  if(pre.decode) pre.decode().then(show).catch(() => { if(pre.complete && pre.naturalWidth) show(); else fail(); });
  else pre.onload = show;
}

/* ---- smooth scrolling engine ---- */
const easeInOutCubic = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2;
const easeOutQuint   = t => 1 - Math.pow(1-t,5);
const wait = ms => new Promise(r => setTimeout(r, ms));

function glide(to, duration, ease){
  return new Promise(done => {
    cancelAnimationFrame(anim);
    const from = reel.scrollTop, dist = to - from;
    if(Math.abs(dist) < 1){ done(true); return; }
    let start = null;
    const step = now => {
      if(start === null) start = now;
      const t = Math.min((now - start) / duration, 1);
      reel.scrollTop = from + dist * ease(t);
      if(t < 1 && nudging) anim = requestAnimationFrame(step);
      else done(t >= 1);
    };
    anim = requestAnimationFrame(step);
  });
}

/* ---- scroll cue ---- */
function cueEl(){ return document.getElementById('cue'); }
function cueShow(){
  if(cueEl()) { cueEl().classList.remove('gone'); return; }
  const d = document.createElement('div');
  d.id = 'cue'; d.innerHTML = '<span></span>';
  document.body.appendChild(d);
}
function cueHide(){
  const c = cueEl();
  if(!c) return;
  c.classList.add('gone');
  setTimeout(() => c.remove(), 500);
}

/* ---- nudge: peek at image 2, ease back ---- */
async function nudge(){
  if(userTook || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  nudging = true;
  reel.style.scrollSnapType = 'none';
  if(!await glide(window.innerHeight * 0.5, 1100, easeInOutCubic)) return;
  await wait(650);
  if(!nudging) return;
  if(!await glide(0, 950, easeOutQuint)) return;
  nudging = false;
  reel.style.scrollSnapType = 'y mandatory';
}
function stopNudge(){
  userTook = true;
  if(nudging){
    nudging = false;
    cancelAnimationFrame(anim);
    reel.style.scrollSnapType = 'y mandatory';
  }
}

/* ---- redirect ---- */
function go(){
  if(sent) return;
  sent = true;
  clearTimeout(autoTimer);
  location.href = DEST;
}
function startAuto(){
  if(autoTimer || sent) return;
  autoTimer = setTimeout(go, AUTO_MS);
}

/* ---- build (or rebuild) the reel ---- */
function render(list){
  clearTimeout(autoTimer); autoTimer = null;
  cancelAnimationFrame(anim);
  if(io) io.disconnect();
  reel.innerHTML = '';
  imgs = [];
  nudging = false; userTook = false; sent = false;
  reel.style.scrollSnapType = 'y mandatory';

  list.forEach(src => {
    const s = document.createElement('section');
    s.className = 'slide';
    const img = document.createElement('img');
    img.alt = ''; img.decoding = 'async'; img.dataset.src = src;
    s.appendChild(img); reel.appendChild(s); imgs.push(img);
  });

  reel.scrollTop = 0;
  for(let i = 0; i <= AHEAD; i++) load(i);

  io = new IntersectionObserver(es => es.forEach(e => {
    if(e.isIntersecting){
      const i = [...reel.children].indexOf(e.target);
      for(let n = 1; n <= AHEAD; n++) load(i + n);
    }
  }), {root: reel, threshold: .25});
  [...reel.children].forEach(s => io.observe(s));

  cueShow();

  if(imgs[0].complete) setTimeout(nudge, 600);
  else imgs[0].addEventListener('load', () => setTimeout(nudge, 600), {once:true});

  if(START_ON === "load") startAuto();
}

/* ---- listeners (bound once) ---- */
reel.addEventListener('scroll', () => {
  if(nudging) return;
  if(reel.scrollTop > 20){
    cueHide();
    if(START_ON === "scroll") startAuto();
  }
}, {passive:true});

reel.addEventListener('click', e => { if(e.target.tagName === 'IMG') go(); });

['touchstart','wheel','keydown','pointerdown'].forEach(ev =>
  window.addEventListener(ev, stopNudge, {passive:true})
);

document.addEventListener('visibilitychange', () => {
  if(document.hidden){ clearTimeout(autoTimer); autoTimer = null; }
  else if(START_ON === "load" && !sent) startAuto();
});

/* ---- first load ---- */
render(nextSet());

/* ---- Back button: page restored from cache, JS never re-ran ---- */
window.addEventListener('pageshow', e => {
  if(!e.persisted) return;          // normal load already handled above
  render(nextSet());
});
</script>
</body>
</html>
